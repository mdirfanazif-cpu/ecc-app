<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f5f4f0;--panel:#fff;--ink:#1f2630;--muted:#5f6974;--line:#d8d9d2;--navy:#22406a;--navy-ink:#fff;--accent:#1d7f6a;--accent-soft:#e2f0eb;--chip:#eeeee8;
 --warn-bg:#fcf3d8;--warn-ink:#6b5310;--crit:#a12b2b;--crit-bg:#f6dcdc;--ok:#12695a;--ok-bg:#dcefe8;--font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181c;--panel:#1d2227;--ink:#e7e9ec;--muted:#9ba4ad;--line:#343b43;--navy:#243f66;--accent:#45b39a;--accent-soft:#1e3a33;--chip:#272d34;--warn-bg:#3e3519;--warn-ink:#e9d38a;--crit:#e37070;--crit-bg:#462020;--ok:#52c3a8;--ok-bg:#1c3d35;color-scheme:dark}}
:root[data-theme=dark]{--bg:#15181c;--panel:#1d2227;--ink:#e7e9ec;--muted:#9ba4ad;--line:#343b43;--navy:#243f66;--accent:#45b39a;--accent-soft:#1e3a33;--chip:#272d34;--warn-bg:#3e3519;--warn-ink:#e9d38a;--crit:#e37070;--crit-bg:#462020;--ok:#52c3a8;--ok-bg:#1c3d35;color-scheme:dark}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;max-width:420px;width:100%}
.gate h2{margin:0 0 8px;font-size:20px}.gate p{margin:0 0 12px;color:var(--muted);font-size:14px}
.gate input{width:100%;font:inherit;font-size:18px;letter-spacing:.12em;text-transform:uppercase;padding:12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
.gate .err{color:var(--crit);font-size:13px;min-height:18px;margin:6px 0}
.btn{font:inherit;font-weight:700;padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}.btn.small{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:var(--navy-ink);padding:10px 16px 0}
header h1{margin:0;font-size:17px;font-weight:800}header .sub{font-size:12px;opacity:.8}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-current=page]{background:#fff;color:var(--navy)}
main{padding:14px 16px 60px;max-width:860px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card h2{margin:0 0 6px;font-size:16px}.card h3{margin:14px 0 6px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card p{margin:0 0 8px}.muted{color:var(--muted);font-size:13.5px}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:0 0 6px}
details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:flex-start}summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--accent);flex:0 0 auto}details[open] summary::before{content:"▾"}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted);margin-right:6px}
.tag.crit{background:var(--crit-bg);color:var(--crit)}.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}input.f,textarea.f,select.f{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
textarea.f{min-height:70px}
pre.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.5 var(--font);margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}.chk:first-of-type{border-top:0}
.chk input{width:20px;height:20px;margin:3px 0 0;flex:0 0 auto;accent-color:var(--accent)}.chk.done span{text-decoration:line-through;color:var(--muted)}
.res{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.res b{display:block}.note{border-left:3px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:0 10px 10px 0;font-size:13.5px;margin:8px 0}
.note.warn{border-left-color:var(--warn-ink);background:var(--warn-bg)}
footer{font-size:12px;color:var(--muted);padding:20px 0 0;text-align:center}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin:0 0 12px}
mark{background:#ffe9a8;color:inherit;border-radius:3px}
</style>

<header><h1>SW1 FME Desk</h1><div class="sub" id="sub">The repeat questions, answered once.</div><nav class="tabs" id="tabs" aria-label="Sections"></nav></header>

<script id="data" type="application/json">{"today": {"Morning, before site": ["Open FIMS on the phone: filter Status → Location → Type of Work to your own schools. Acknowledge anything new; do Notify Supervisor and Notify Technician too, or the vendor cannot see the job.", "Check the vendor has assigned a technician on every open job. Silence = chase the vendor supervisor, not the system.", "Anything from an OM, SCD or the SO since yesterday? Acknowledge today. The acknowledgement satisfies the 3-working-day clock.", "Works starting today: is the PTW, RA and method statement on file? General PTW you approve; WAH, confined space, LOTO and hotworks are daily and signed by the contractor's PM.", "Scan the school once: ceiling, glass, drains, standing water, gates. Photo anything off before anyone else reports it."], "During the day": ["Every job: arrival must be the QR scan on the app, not the button. The scan is the SLA clock.", "Any complaint, from any channel: acknowledge, log it, then fix. Closing the job is not closing the loop; tell the reporter.", "Quotation request received: write down the required-by date in your reply and work backwards from the QS hand-off.", "Vendor quiet for 3 working days on an open ask: dated chase email today. Count from the last thing you RECEIVED from them."], "Before you leave": ["No job left at Pending Assignment that you could have acknowledged.", "Every work completion attachment uploaded (5,120 KB cap). A CW job without it does not close.", "Log escalation attempts with the time. Tomorrow's you will need them.", "Going on leave soon? Delegate your FIMS positions BEFORE the first day, or jobs freeze."]}, "ph": ["2026-01-01", "2026-02-17", "2026-02-18", "2026-03-20", "2026-04-03", "2026-05-01", "2026-05-27", "2026-06-01", "2026-08-10", "2026-11-09", "2026-12-25", "2027-01-01", "2027-02-06", "2027-02-08", "2027-03-10", "2027-03-26", "2027-05-01", "2027-05-17", "2027-05-20", "2027-08-09", "2027-10-29", "2027-12-25", "2027-12-27"], "fims": [{"t": "The three-line mental model", "b": ["Every piece of work is a transaction: Fault (FR/…), Job (JO/…), Quotation, Claim, Scorecard. Same furniture every time: tabs down the left, workflow buttons across the top, state badge top-right.", "The badge says where it is. The buttons say what you may do.", "Saving is not submitting. Save keeps a draft. Nothing moves until you click a named button."]}, {"t": "Phone or laptop?", "b": ["Phone, daily: open, acknowledge, chase the vendor's assignment, QR arrival scan, checklist, completion photo, reschedule.", "Laptop, build and money: 52-week PPM work schedules, FSOR and Service Catalog rates (they do not load on the app), exports, anything the QS or Contract Support will look at with you.", "The app's status tiles count ALL of SW1 and SW6. Filter Status → Location → Type of Work every time."]}, {"t": "\"It won't let me\": the greyed-out button", "b": ["Greyed out = you are not the assigned user for that step. Read the Assigned Position(s) field; it names who must act next. Nine times in ten, \"FIMS is broken\" means it is someone else's turn.", "Nothing opens when clicked: records open in a new window; your pop-up blocker is on.", "A record is missing: search pages show the top 500 only. Check filters and records per page.", "Cannot approve your own submission: by design. The creator never approves their own action.", "Session dropped: one active session per user, Singapore only. Accounts lock after 90 days idle; only CBRE's FIMS User Administrator can unlock.", "View Workflow History = who clicked what and when. That is your evidence in an SLA dispute."]}, {"t": "Attachments: the limits that bite", "b": ["General attachment 10 MB per file. Work Completion Attachment on Corrective Works: 5,120 KB per file.", "Allowed: JPG, PNG, GIF, PDF, DOC/DOCX, XLS/XLSX, PPT/PPTX, MSG, TXT, CSV, ZIP and a few more. Every upload is malware-scanned and must come back Safe.", "Excel goes in as Excel. Never paste a spreadsheet into Word.", "Photo too big: resize from the share sheet (iPhone: Share → Options → smaller size; Android: Gallery → Edit → Resize), or screenshot the photo, or combine several into one PDF.", "The Work Completion Attachment is compulsory. A CW job cannot be submitted for acceptance or closure without it."]}, {"t": "How faults arrive and where they go", "b": ["Four channels: Public Site (no login, photo mandatory), the app, web, and SSA. Submitting returns FR/xxxx/xxxxxx.", "A fault submitted on the app does not show back to the reporter. It is queued at the Fault Helpdesk, not lost. That is the answer to \"I reported it and nothing happened\".", "Fault Type + Location tied to a term contractor → straight to Pending Execution. Nothing tied → Pending Helpdesk, and CBRE assigns by hand while the clock runs. Flag every mapping gap you meet."]}, {"t": "Jobs: the click path (vendor self-assigns since 5 Sep 2026)", "b": ["Pending Assignment → Pending Execution → (with costing: Pending Recommendation → Pending RFW/RFQ → Pending Acceptance → Pending Final BQ → Pending Closure) → Closed.", "1. Acknowledge, then Notify Supervisor and Notify Technician. Until all three are done the vendor cannot see or scan the job.", "2. The vendor assigns their own technician. Your job is to check they did, not to do it for them.", "3. Arrive On-Site: in live operations this must be the QR scan on the app. The scan timestamp is the SLA clock. No scan, no defensible response time.", "4. Resolution tab: Resolution Description is mandatory. Then Actual Start and Actual End.", "5. Resolution Decomposition: one row per trade. This feeds MOE's defect trending; sloppy entries become bad trend data at the KPI meeting.", "6. Attachments: the compulsory completion photo. 7. Submit.", "Acknowledge is not Arrive. Both are timestamped and mean different things.", "Actual quantity above estimate flips the button to Submit for Modification Recommendation: a Work Order Modification. You cannot quietly overrun a WO."]}, {"t": "Quotations: the 8-step chain for any CW job with cost", "b": ["1. Contract Support sends you the CW job list with each job's quotation due date. That date is the clock.", "2. You get the vendor's quotation.", "3. You email the vendor quotation AND the FIMS Job ID to the QS and Contract Support, cc your FM. No Job ID, nothing moves.", "4. QS and Contract Support review, then THEY create the quotation in FIMS and tell you when it is routed for school/OM approval.", "5. The school approves inside FIMS, not by email. You then email QS/CS again with the Job ID asking Contract Support to raise the PO.", "6. Contract Support raises the vendor PO and sends it to you.", "7. You send the PO to the vendor. That is their authority to start. No PO, no work.", "8. Work is done; the service report MUST be attached. No service report, no acceptance, no claim.", "Steps 2, 3, 5, 7 and 8 are yours. If a job is stuck, check those five before chasing anyone. Never ask Contract Support for a PO before the school has approved in FIMS.", "The offline quotation route was withdrawn on 6 Sep 2026. Do not tell a school that CBRE is quoting offline."]}, {"t": "Read the buttons: which lane am I in?", "b": ["Reject and Submit for Execution only → at or below custodial. Without costing, self-managed, CBRE's own cost. Closes instantly on submission.", "Submit for Recommendation also shows → above custodial, or a Star Rate is present. With costing. MOE is involved and the quotation clock is live.", "A quotation can still be raised during execution and it flips the job to with-costing. If the technician finds more than expected, quote it BEFORE closing.", "At review stages nearly every field locks; reviewers can edit only Comments and Attachments. Catch errors before you submit."]}, {"t": "What \"Pending …\" means", "b": ["Pending Helpdesk: no contractor mapped. CBRE assigns by hand, clock running.", "Pending Assignment: waiting for Acknowledge + Notify Supervisor + Notify Technician, then the vendor's technician.", "Pending Execution: assigned, work can proceed. Worker surveys and decides above or below custodial.", "Pending Recommendation: Contract Support moves it here, not you. Costing under review.", "Pending RFW / Pending RFQ: same step, two names. Waiting for the vendor's quotation.", "Pending Acceptance: MOE/school to accept the work or the quotation in FIMS.", "Pending Final BQ: final bill of quantities after work. Pending Closure: report and photos, then Closed."]}, {"t": "Housekeeping that prevents pain", "b": ["Profile icon → delegate positions before the first day of leave.", "Work Schedules must exist before their start date or no Preventive Jobs generate. Build on the laptop, schedule by week range, set location at school level, and add yourself under Job Cost and Labor on the schedule itself or you are locked out of your own PM jobs.", "Regulatory Repository: monthly. Records created AND reviewed by the Site Rep before month end.", "Preventive Jobs carry no costing. Found a fault during PM? Raise a Fault or an ad-hoc Corrective Job.", "If the scorecard or its deduction and incentive items are unconfirmed at consolidation, FIMS assumes MAXIMUM deduction and ZERO incentive, trued up later. Confirm on time."]}, {"t": "Getting data out", "b": ["Job Cost and Labor → Download Job Cost and Labor Excel: the costing lines, for checking arithmetic and for the QS.", "Summary tab → Generate PDF: the consolidated record. That is what you send a school asking \"what happened with that fault?\"."]}], "route": {"fork": [["CW / PW: fixing, repairing or replacing something that already exists", "Technical Report REQUIRED. You write it, your FM countersigns. Justifies the need to MOE."], ["MWI Type A to D: minor new works", "No Technical Report; runs on the works proposal. A = new facility, changes GFA/NFA. B = converts a facility to another use. C = reconfigures without a use change. D = new works in an existing facility (extra fans, railing height, weather protection). You manage C and D; A and B lean to Projects."], ["Projects, A&A, consultant-led, design-phase", "Not FM delivery. Route to the Projects team and hold the client relationship with an interim reply. Do not work it up as an FM job."]], "cls": [["Critical", "30 min", "1 hr", "24 hr", "Endangers safety, damages assets, disrupts operations. ALL fire protection faults. Fallen ceiling board or glass. Breeding or standing water. Lift with person trapped."], ["Urgent", "1 hr", "4 hr", "72 hr", "Disruption, inconvenience or reputational impact; partial loss of an M&E system (fire protection excluded, that is Critical)."], ["Normal", "8 hr (24 hr non-school)", "24 hr", "", "Localised, no effect on operations or occupants."]], "ptw": [["General PTW", "1 week", "The FME (you). The only permit you approve."], ["Work at Height, Confined Space, LOTO, Hotworks", "Daily, re-issued each day", "The contractor's own Project Manager. You check it exists; you never sign it."]], "money": [["At or under $250 on the ADJUSTED rate", "In-house, no approval. Without costing in FIMS."], ["Above $250 adjusted", "Written OM / Employer Rep approval BEFORE work starts. Start without it and CBRE eats the cost."], ["Under $6,000", "Quotation due in 7 days. The contract deck reads calendar days; plan on calendar days to be safe."], ["$6,000 and above", "Quotation due in 14 days. The QS vets before anything leaves CBRE."], ["Always", "Nothing priced leaves CBRE without the QS vet. A vendor's quotation never reaches MOE; it is retyped onto the CBRE template. No adjustment percentage is ever visible to a vendor or the client."]], "consult": ["Injury or damage", "Negligence or fault", "Money above your limit", "Contract interpretation", "A complaint naming a person", "Anything direct from the SO", "Anything alleging a breach"], "escalate": ["Tier 0: MOE Helpdesk 6371 3605", "Tier 1: you, the FME", "Tier 2: your FM", "Tier 3: the SFM", "Tier 4: the account lead", "Escalate after 2 unanswered attempts, a missed target, or a worsening issue. Log the time of each attempt."], "tell": ["Every school matter copies that school's OM. Check the standing instruction for your school; some OMs want a second OM copied on everything.", "Send to the SCD manager of that school's cluster, not the one you know best. A matter sent to the wrong cluster is misrouted.", "Domains: school staff @schools.gov.sg, MOE HQ @moe.gov.sg, some OMs @moe.edu.sg. Never guess a spelling; VPAs and OMs notice.", "Reply vs Reply All: say which. Never drop a school leader who was on the original.", "Never put a vendor on a thread carrying CBRE pricing or percentages."]}, "play": [{"n": 1, "sec": "SAFETY / STRUCTURE - THESE COME FIRST", "what": "Ceiling board or window glass falls", "how": "CRITICAL", "first": "Cordon the area. Photo. WhatsApp SCD immediately. Check for injury - if anyone hurt, run the incident chain at row group below. Report in FIMS.", "who": "Jie Xuan (make safe same day)", "type": "CW + Technical Report for the repair", "gate": "Above $250 adjusted: OM approval before repair. Make-safe is immediate regardless.", "dont": "This specific failure also draws a 1% site-fee direct deduction - tell your FM the same day."}, {"n": 2, "sec": "SAFETY / STRUCTURE - THESE COME FIRST", "what": "Any fire protection fault (alarm, sprinkler, hosereel, extinguisher, dry riser)", "how": "CRITICAL - always", "first": "Report in FIMS as Critical. Propell responds. If system impaired, agree interim fire watch measures with the school.", "who": "Propell (fire protection specialist)", "type": "CW + TR if replacement of existing", "gate": "PTW for hotworks-adjacent fixes is DAILY, contractor PM approves", "dont": "Never downgrade a fire fault. Downtime beyond allowed needs the Employer Rep to agree the interim timeline in writing."}, {"n": 3, "sec": "SAFETY / STRUCTURE - THESE COME FIRST", "what": "Somebody injured on site (pupil, staff, contractor, public)", "how": "INCIDENT", "first": "Make safe, first aid / 995 as needed. 1) WhatsApp SCD immediately. 2) MOE Incident Report form same day. 3) FIMS incident record. Photos, names, times.", "who": "You coordinate; WSHO the WSHO for anything work-related", "type": "n/a", "gate": "n/a", "dont": "NEVER concede fault, liability or cause in anything written. Consult your FM before replying to anyone outside CBRE."}, {"n": 4, "sec": "SAFETY / STRUCTURE - THESE COME FIRST", "what": "Mosquito breeding / standing water found", "how": "CRITICAL", "first": "Photo. Rentokil SAME DAY to destroy the habitat. Fix the source (choked drain -> Jie Xuan; tank -> Propell/Jie Xuan). Photo the clearance.", "who": "Rentokil + trade owning the water source", "type": "Usually in-house / base service", "gate": "Provisional treatments (fogging, BTI) need a WO first", "dont": "An NEA fine voids every incentive on the whole contract. Log hotspots on your tracker."}, {"n": 5, "sec": "SAFETY / STRUCTURE - THESE COME FIRST", "what": "Snake / wasp nest / wildlife", "how": "URGENT", "first": "Keep people away, inform school office. Rentokil certified wildlife handler. Do not let anyone else handle it.", "who": "Rentokil (certified handler)", "type": "Base/provisional per case", "gate": "n/a", "dont": "Live animals go in carriers; carcasses double-bagged, cooler box. It's a Wildlife Act matter - handler only."}, {"n": 6, "sec": "M&E - POWER, LIFTS, AIRCON, SYSTEMS", "what": "Lift breakdown - person trapped", "how": "CRITICAL", "first": "Call lift rescue (OEM 24h line) + reassure via intercom. Once released: check injury (incident chain if any). FIMS record. Lift stays down until OEM clears.", "who": "Propell / lift OEM", "type": "CW if parts replaced + TR", "gate": "OM approval if above $250 adjusted", "dont": "Zero lift breakdowns contract-wide in a month = incentive for everyone - report honestly but fix fast. PTO must stay valid."}, {"n": 7, "sec": "M&E - POWER, LIFTS, AIRCON, SYSTEMS", "what": "Whole block power trip", "how": "CRITICAL/URGENT", "first": "Propell isolates the fault and restores supply section by section. Inform school office which areas affected and expected time.", "who": "Propell; LEW for switchroom work", "type": "CW + TR if equipment replaced", "gate": "LOTO permit DAILY, contractor PM approves", "dont": "Thermal scan and injection test records help find the cause - pull the last reports."}, {"n": 8, "sec": "M&E - POWER, LIFTS, AIRCON, SYSTEMS", "what": "Classroom aircon down", "how": "NORMAL/URGENT", "first": "FIMS report. Propell checks - filter/gas/compressor. If a teaching space is unusable in exam period, treat as Urgent and say so in FIMS.", "who": "Propell; chiller issues -> OEM specialist", "type": "CW + TR if replacement", "gate": "Above $250 adjusted -> OM approval first", "dont": "Check it isn't just a tripped breaker or dirty filter before a quote appears."}, {"n": 9, "sec": "M&E - POWER, LIFTS, AIRCON, SYSTEMS", "what": "Gate / turnstile / roller shutter fault", "how": "URGENT", "first": "If a security gate: G4S covers the gap with an officer while Propell repairs. FIMS report.", "who": "Propell (mechanical/electrical)", "type": "CW + TR if parts", "gate": "Standard gates", "dont": "A gate stuck open is a security exposure - tell G4S first, not last."}, {"n": 10, "sec": "M&E - POWER, LIFTS, AIRCON, SYSTEMS", "what": "CCTV / intrusion system down", "how": "URGENT", "first": "Propell checks NVR, cameras, comms. G4S increases patrol of blind areas meanwhile.", "who": "Propell + monitoring centre", "type": "CW + TR if parts", "gate": "Standard", "dont": "Recording gaps matter if an incident happens that week - note the downtime window in FIMS."}, {"n": 11, "sec": "BUILDING & WATER", "what": "Underground / concealed pipe burst", "how": "URGENT", "first": "Isolate the supply. Licensed plumber (via Jie Xuan) repairs within the required window; specialist leak detection if the run is concealed.", "who": "Jie Xuan - licensed plumber", "type": "CW + TR", "gate": "Cost sits per Conditions of Contract Cl 12.1 - flag to the QS", "dont": "Meter readings before/after help the water-loss story. Check PUB notification needs with WSHO."}, {"n": 12, "sec": "BUILDING & WATER", "what": "Roof leak into classroom", "how": "URGENT", "first": "Buckets + cordon, move what's under it. Photo the ceiling stain AND the roof area above. FIMS. Jie Xuan traces on the next dry access.", "who": "Jie Xuan (waterproofing = specialist)", "type": "CW + TR", "gate": "Above $250 adjusted -> OM approval", "dont": "Waterproofing is a named specialist scope - a general worker patching it voids the fix. WAH permit DAILY for roof access."}, {"n": 13, "sec": "BUILDING & WATER", "what": "Toilet choke / flood", "how": "URGENT", "first": "Weishen contains and cleans surface water. Jie Xuan clears the choke (plumber). Find the cause - repeat chokes at the same stack = CCTV survey case.", "who": "Jie Xuan; Weishen for clean-up", "type": "In-house if minor", "gate": "Usually under custodial limit", "dont": "Repeat same-fault-same-place can escalate the classification - track it in the tracker."}, {"n": 14, "sec": "BUILDING & WATER", "what": "Playground / fitness equipment broken", "how": "URGENT", "first": "Cordon it off immediately (kids). Photo. FIMS. OEM or certified contractor repairs - not a general handyman.", "who": "Jie Xuan via OEM/certified contractor", "type": "CW + TR", "gate": "OM approval likely (parts)", "dont": "Quarterly OEM servicing should have caught it - pull the last service report before signing any quote."}, {"n": 15, "sec": "GROUNDS", "what": "Fallen tree / large branch", "how": "CRITICAL if blocking/danger", "first": "Cordon. Mao Sheng crew activates immediately. Clear obstruction same day. Photo before/after.", "who": "Mao Sheng (arborist decides cuts)", "type": "Base service; felling needs SO permission", "gate": "n/a", "dont": "If it hit property or a person - incident chain first. NParks approval where the tree is protected."}, {"n": 16, "sec": "GROUNDS", "what": "Field damaged / unsafe (holes, bald patches)", "how": "NORMAL", "first": "Photo, horticulturist assesses. School may need to close the field - help them decide with the assessment in hand.", "who": "Mao Sheng", "type": "Routine if within scope; quote if beyond", "gate": "Standard gates", "dont": "Yearly rolling/spiking and top dressing is already in scope - don't accept a quote for what the contract already pays."}, {"n": 17, "sec": "PEOPLE & PAPER", "what": "Complaint from school (any channel)", "how": "3-WD CLOCK", "first": "Acknowledge same day if you can - the acknowledgement satisfies the clock. Log it. Investigate, then substantive reply.", "who": "You; trade vendor for the fix", "type": "Per the underlying fault", "gate": "Per the underlying fault", "dont": "Named-person complaint or anything smelling of negligence -> consult your FM BEFORE replying. Draft first, flag on top."}, {"n": 18, "sec": "PEOPLE & PAPER", "what": "Instruction direct from the SO", "how": "3-WD CLOCK + FM", "first": "Acknowledge. Then consult your FM before the substantive reply - SO-direct items are always consult-first.", "who": "Per instruction", "type": "Per instruction", "gate": "Per instruction", "dont": "Capture the required-by date in your acknowledgement. Log every escalation attempt with its time."}, {"n": 19, "sec": "PEOPLE & PAPER", "what": "Quotation request from OM/SCD", "how": "7/14-DAY CLOCK", "first": "Under $6,000: quote due in 7 working days. At/above: 14. Work BACKWARDS: vendor quote -> the QS vet -> Contract Support keys -> approval. Your real deadline is May's hand-off.", "who": "Vendor prices; the QS vets; Contract Support keys", "type": "Note works type on the RFW", "gate": "$250 adjusted test decides OM approval need", "dont": "Vendor's paper never reaches MOE. Retype on CBRE template. No percentages anywhere visible."}, {"n": 20, "sec": "PEOPLE & PAPER", "what": "VIP visit / function support request", "how": "PLAN AHEAD", "first": "Confirm scope (cleaning, security, standby M&E). After-hours cleaning needs Employer Rep approval. G4S extra officers = Provisional service = WO.", "who": "Weishen + G4S + Propell standby", "type": "Provisional services", "gate": "WO before extra manpower", "dont": "Gifts to MOE/school staff: zero. Government entity - no exceptions."}, {"n": 21, "sec": "PEOPLE & PAPER", "what": "Vendor silent on an open ask", "how": "CHASE at 3 wd", "first": "3 working days silence = chase with a dated email. 5+ or repeat offender = structure meeting item, not another email.", "who": "You", "type": "n/a", "gate": "n/a", "dont": "Count working days from the last thing RECEIVED from them, not from what you sent. Log it in your tracker."}], "vend": [{"name": "JIE XUAN - G05 BUILDING", "qa": [], "office": "Office 6242 6690"}, {"name": "MAO SHENG - G06 LANDSCAPE / TURF", "qa": [], "office": "Admin 6285 2300"}, {"name": "PROPELL - G07 M&E", "qa": [], "office": "Via your FIMS vendor rep"}, {"name": "WEISHEN - G08 CLEANING", "qa": [], "office": "Individual emails only; the MOEZone9@ group mailbox bounces CBRE mail"}, {"name": "RENTOKIL - G09 PEST CONTROL", "qa": [], "office": "Mainline 6347 8138"}, {"name": "G4S - G10 SECURITY", "qa": [], "office": "Quotations via the Senior Ops Admin, not the ops lead"}], "meet": {"structure": {"what": "A monthly operational meeting per school with the OM, the SCD where they attend, and the vendors that need to be in the room. It is a contract requirement (Part G3), so it happens whether or not there is much to say. One school per meeting; both schools in the same week is fine, on different days, and never on the same morning as the scorecard or KPI meeting.", "bring": ["Works status: open jobs by vendor, with FIMS Job IDs and ages.", "Open quotations and where each sits on the 8-step chain.", "Incidents and complaints since the last meeting, and what closed them.", "Vendor performance items: anything silent 5+ working days, repeat offenders.", "PPM due this month and any slipped.", "School requests awaiting a decision, with the required-by dates."], "agenda": "STRUCTURE MEETING · [School] · [Date, time] · [Venue]\n\nAttendees: [OM], [SCD if attending], [FM], [FME], [vendor reps]\nApologies:\n\n1. Matters arising from last meeting (open actions, owner, status)\n2. Safety and incidents since last meeting\n3. Faults and corrective works: open jobs by vendor, ages, blockers\n4. Quotations: status of each open quotation and required-by dates\n5. Preventive maintenance: completed, due, slipped\n6. Cleaning, security, pest, landscape: service matters raised by the school\n7. Vendor performance: outstanding asks and response times\n8. School requests and upcoming events (exams, functions, VIP visits)\n9. Any other business\n10. Next meeting: [date]\n\nAction list: #, action, owner, due date", "minutes": "MINUTES · Structure Meeting · [School] · [Date]\n\nPresent: \nApologies: \nChair: \nMinutes by: \n\n1. Matters arising\n   1.1 [Item] — [status] — Owner: [name] — Due: [date]\n\n2. Safety and incidents\n   2.1 [Nil / item]\n\n3. Faults and corrective works\n   3.1 [JO/…] [description] — [status] — Owner — Due\n\n4. Quotations\n   4.1 [JO/…] [description] — [step on the chain] — required by [date]\n\n5. Preventive maintenance\n   5.1 \n\n6. Service matters (cleaning / security / pest / landscape)\n   6.1 \n\n7. Vendor performance\n   7.1 \n\n8. School requests and upcoming events\n   8.1 [Request] — required by [date] — Owner\n\n9. AOB\n\n10. Next meeting: [date, time, venue]\n\nACTION LIST\n# | Action | Owner | Due | Status\n1 | | | |\n\nDistribution: [OM], [SCD], [FM], [vendor reps]\nNote: vendor pricing and CBRE rates are never minuted."}, "scorecard": {"what": "The monthly performance scorecard per site. Score starts at 100 and points are deducted; Tp (target) is 85. You compute and submit it to the Employer Rep for endorsement within the first two weeks of the following month, from FIMS data. The SO's decision is final.", "present": ["The running score and the buffer left against Tp 85.", "Points by category, each with the event that drove it.", "Response & Closure scored limb by limb (response time, down time, claims in time, accuracy, 3-working-day replies). Never merged.", "Direct deductions listed separately: they are not capped like points.", "Incentives: only claimable if the site is already at Tp or above.", "Complaints near a cap (security at 2, cleaning at 5): the next one converts to a cash deduction.", "Repeat-failure clocks running: same issue within 3 months of the previous CLOSURE.", "What would have prevented the biggest deduction, and the one action for next month."], "cats": [["1 Safety", "5 pts per incident, three separate triggers: incident / regulatory lapse; no RA or MS before work; not working to the MS. +2 if the incident report is late (24 h). +5 if harm or damage."], ["2 Complaints", "1 pt per written complaint about personnel, cap 10 per month. Includes \"did not close the loop with the feedback provider\"."], ["3 Response & Closure", "Five limbs, each: 1–3 cases 2 pts, 4–6 cases 4 pts, 7–8 cases 6 pts, then +1 per case, cap 10 per limb."], ["4 Operations", "Service standard failures on the same scale. Power, water or gas disruption, or electrical fire: 5 pts per case."], ["5 Security", "Replacement officer not within 1 hour: 2 pts. Complaint about an officer: 5 pts, cap 2 per month, then direct deduction."], ["6 Cleaning", "Replacement cleaner not within 24 hours: 2 pts. Complaint about a cleaner: 2 pts, cap 5 per site per month, then direct deduction."], ["7 Others", "Lift disruptions 2 pts for 1–2 cases, more above. Same lift twice in a month: 2 pts. Any authority warning or fine: 2 pts."]], "rules": ["Erroneous scores are corrected retrospectively only 3 times per 12 months per school. On the 4th, an under-declaration is not re-adjusted. Check the scorecard before it goes.", "If the scorecard is unconfirmed at consolidation, FIMS assumes maximum deduction and zero incentive.", "An NEA fine for mosquito breeding voids every incentive on the whole contract.", "Three months averaging below Tp across all sites = a warning letter. Three letters in a contract year entitles MOE to terminate."]}, "calendar": [["Every school day", "ECC 10% inspection log, countersigned weekly"], ["By the 3rd working day", "ECC G8/1 declaration for the previous month"], ["First 2 weeks of the month", "Scorecard for the previous month to the Employer Rep"], ["Within 30 days of acceptance", "Payment claim per job (late = 0.1% direct deduction)"], ["Before month end", "Regulatory Repository records created and reviewed"], ["Monthly", "Structure meeting per school; management meeting with the Employer"], ["Half-yearly", "Head Office QA audit; senior management meeting"]]}, "tpl": [{"id": "ack", "g": "OM and SCD", "t": "Acknowledgement (starts and satisfies the 3-working-day clock)", "f": [["name", "Dear …", "Mr Lim"], ["item", "What they raised", "the leaking tap at Blk B L2"], ["date", "You will revert by", "Thursday 23 Oct"]], "s": "RE: [item]", "b": "Dear [name],\n\nThank you for your email on [item]. We have noted it and are looking into it.\n\nI will revert with the findings and the next steps by [date].\n\nRegards,\n[me]"}, {"id": "reply", "g": "OM and SCD", "t": "Substantive reply (fact, action, date, one question)", "f": [["name", "Dear …", "Mr Lim"], ["item", "What they raised", "the leaking tap at Blk B L2"], ["fact", "What is known, no cause", "our plumber inspected on 21 Oct and found the mixer worn"], ["action", "What will be done, by whom", "Jie Xuan will replace the mixer"], ["date", "By when", "Friday 24 Oct"], ["q", "The one question that unblocks", "Could the school confirm access to the staff pantry after 3pm?"]], "s": "RE: [item]", "b": "Dear [name],\n\nFollowing your email on [item]: [fact].\n\n[action], by [date].\n\n[q]\n\nRegards,\n[me]"}, {"id": "approval", "g": "OM and SCD", "t": "In-principle approval request (above $250 adjusted)", "f": [["name", "Dear …", "Mr Liew"], ["school", "School", "Alexandra Primary"], ["work", "The work, plainly", "one 3-ton skid bin for waste clearance, 11 to 18 Nov"], ["date", "Reply needed by", "Monday 3 Nov"]], "s": "[school] - [work], in-principle approval", "b": "Dear [name],\n\nFollowing the matter discussed, we propose to proceed with [work] at [school].\n\nAs this falls above the custodial threshold, may I have your in-principle approval to proceed? The formal quotation will follow through FIMS once vetted internally.\n\nGrateful for a reply by [date] so the work can be scheduled without affecting the school.\n\nRegards,\n[me]"}, {"id": "closeloop", "g": "OM and SCD", "t": "Close the loop with the reporter (prevents a complaint under limb c)", "f": [["name", "Hi …", "Mdm Tan"], ["item", "What was reported", "the flickering light at the General Office"], ["done", "What was done", "the ballast was replaced this morning"]], "s": "RE: [item]", "b": "Hi [name],\n\nOn [item]: [done]. Please let me know if it recurs.\n\nThank you for flagging it.\n\nRegards,\n[me]"}, {"id": "chase1", "g": "Vendors", "t": "Vendor chase 1, polite with a date", "f": [["name", "Hi …", "Chong Ming"], ["item", "What is outstanding", "the quotation for the Blk C roof leak (JO/2610/012345)"], ["sent", "Date first requested", "14 Oct"], ["date", "Need it by", "Thursday 23 Oct, 5pm"]], "s": "Follow-up: [item]", "b": "Hi [name],\n\nFollowing my request of [sent], could you send [item]?\n\nI need it by [date] so it can be vetted and keyed into FIMS in time.\n\nThank you.\n\nRegards,\n[me]"}, {"id": "chase2", "g": "Vendors", "t": "Vendor chase 2, dated and on the record", "f": [["name", "Hi …", "Chong Ming"], ["item", "What is outstanding", "the quotation for the Blk C roof leak (JO/2610/012345)"], ["sent", "Dates already requested", "14 Oct and 20 Oct"], ["date", "Final date", "Monday 27 Oct, 12pm"]], "s": "Second follow-up: [item]", "b": "Hi [name],\n\nThis is the second follow-up on [item], requested on [sent].\n\nPlease send it by [date]. If it is not received by then, I will have to record it as outstanding at the structure meeting and inform my FM, as the school's quotation deadline depends on it.\n\nIf there is a difficulty on your side, call me and we will find a way.\n\nRegards,\n[me]"}, {"id": "chase3", "g": "Vendors", "t": "Vendor chase 3, to their management, FM copied", "f": [["name", "Dear …", "Mr Villavan"], ["vendor", "Company", "Jie Xuan Engineering"], ["items", "Outstanding items with dates", "the Blk C roof leak quotation (requested 14 Oct, 20 Oct, 24 Oct) and the Blk A railing quotation (requested 16 Oct, 22 Oct)"], ["date", "Need by", "Wednesday 29 Oct"]], "s": "[vendor] - outstanding quotations", "b": "Dear [name],\n\nI am writing to you directly as the following items remain outstanding despite repeated requests: [items].\n\nThese are holding up the school's approvals and our contractual quotation deadlines. Could you confirm who on your side will send them, by [date]?\n\nMy FM is copied for awareness.\n\nRegards,\n[me]"}, {"id": "ptw", "g": "Vendors", "t": "Before works start: PTW, RA and method statement", "f": [["name", "Hi …", "Shao Xuan"], ["work", "The work", "replacement of the Blk C gutter"], ["date", "Planned start", "Monday 27 Oct"], ["type", "High-risk permits needed", "work at height"]], "s": "[work] - PTW, RA and MS before start", "b": "Hi [name],\n\nAhead of [work] planned for [date], please send the CBRE PTW form, the risk assessment and the method statement for approval.\n\nThis job involves [type], so the daily permit is to be approved by your Project Manager each day, and a copy kept on site.\n\nWork cannot start until all three are in place.\n\nRegards,\n[me]"}, {"id": "qs", "g": "Internal CBRE", "t": "Quotation hand-off to QS and Contract Support", "f": [["job", "FIMS Job ID", "JO/2610/012345"], ["school", "School", "River Valley Primary"], ["work", "The work", "Blk C roof leak repair"], ["due", "FIMS quotation due date", "30 Oct"]], "s": "[job] - [school] - [work] - vendor quotation for vetting", "b": "Hi both,\n\nAttached is the vendor quotation for [work] at [school], FIMS Job ID [job].\n\nThe FIMS quotation due date is [due]. Could you let me know your turnaround so I can plan the school approval, and confirm once it is routed in FIMS?\n\nThank you.\n\nRegards,\n[me]"}, {"id": "po", "g": "Vendors", "t": "Send the PO to the vendor (their authority to start)", "f": [["name", "Hi …", "Chong Ming"], ["po", "PO number", "PO 4500123456"], ["job", "FIMS Job ID", "JO/2610/012345"], ["work", "The work", "Blk C roof leak repair"], ["date", "Proposed start", "Monday 3 Nov"]], "s": "[po] - [work] - [job]", "b": "Hi [name],\n\nPlease find attached [po] for [work], FIMS Job ID [job]. This is your authority to proceed.\n\nBefore starting, send the PTW, risk assessment and method statement for approval. Proposed start [date]; please confirm.\n\nOn completion, the service report and photos must be attached in FIMS before the job can be accepted.\n\nRegards,\n[me]"}, {"id": "invite", "g": "Meetings", "t": "Structure meeting invite", "f": [["school", "School", "Alexandra Primary"], ["date", "Date and time", "Wed 12 Nov, 10am to 11.30am"], ["venue", "Venue", "General Office meeting room"]], "s": "[school] - Structure Meeting - [date]", "b": "Dear all,\n\nThe monthly structure meeting for [school] is on [date], at [venue].\n\nAgenda: matters arising; safety and incidents; open faults and corrective works; quotations; preventive maintenance; cleaning, security, pest and landscape matters; vendor follow-ups; school requests and upcoming events; AOB.\n\nVendor reps: please come with the status of your open jobs and outstanding quotations.\n\nRegards,\n[me]"}, {"id": "scd", "g": "Incident", "t": "SCD WhatsApp incident message (verbatim template)", "f": [["date", "Date", "21 Oct 2026"], ["school", "School", "River Valley Primary"], ["tier", "Tier", "Amber (Urgent)"], ["issue", "Issue", "Ceiling board fell in Blk B L2 corridor, no injury"], ["time", "Occurrence time", "10.40am"], ["action", "Action taken or recovery plan", "Area cordoned, photos taken, Jie Xuan making safe this afternoon"], ["support", "Mgt support or decision needed", "Nil"], ["etc", "ETC", "Make safe by 3pm today; repair quotation to follow"]], "s": "", "b": "Date: [date]\nSchool: [school]\nTier: [tier]\nIssue: [issue]\nOccurrence time: [time]\nAction taken, or Recovery plan: [action]\nAny Mgt support / decision needed: [support]\nETC (estimated time for completion): [etc]"}, {"id": "whatsapp-om", "g": "OM and SCD", "t": "WhatsApp to OM: short update", "f": [["name", "Hi …", "Mr Lim"], ["item", "Item", "the Blk B toilet choke"], ["status", "Status now", "cleared at 2.15pm, area cleaned"], ["next", "Next step if any", "plumber returns tomorrow to check the trap"]], "s": "", "b": "Hi [name], quick update on [item]: [status]. [next]. Will keep you posted. Thanks."}], "inc": {"safe": ["Anyone hurt? Casualty first: first aid, 995, the school first-aider.", "Isolate the hazard: power off, water off, cordon, barricade, evacuate the area.", "Preserve the scene. Photograph before clearing.", "Stop related work. If in doubt about safety, stop. Stopping is never the wrong call."], "tell": ["School OM or Employer Rep on site, verbally, immediately.", "Your FM, immediately for anything involving injury, damage or liability. The FM signs \"Vetted by\" on the report.", "The SCD, by the WhatsApp template, immediately. Never held for the afternoon report.", "Police 999 or SCDF 995 where the nature requires it.", "The CBRE WSHO for anything work-related: injury, near miss, dangerous occurrence."], "layers": [["1. SCD WhatsApp", "Immediately"], ["2. MOE Incident Report Form", "Same day. 24 hours is the hard penalty line (+2 points)."], ["3. FIMS Incident Report (ICR)", "Internal certify, then the Site Rep accepts. Affects the scorecard."], ["Companion: CBRE internal A–K form", "Same day, alongside layer 2, where CBRE process requires it."]], "types": [["Type A", "2 hours", "Fatal or serious injury, building collapse, dangerous occurrence."], ["Type B", "12 hours", "Construction accidents, acts of God, fire, criminal damage, AND anything that could have injured someone: a fallen ceiling board, glass panel, tile or window, a structural crack. Not Type C."], ["Type C", "24 hours", "Burst mains, power failure, lift breakdown or entrapment, gas leak, with minor or no injury."], ["Type D", "Escalation only", "Criminal matters such as theft or molest."]], "form": "To:\nRef:                              Date:\nHEADING:\nDATE & TIME OF INCIDENT:\nPLACE OF INCIDENT:\n\nBACKGROUND (to indicate source of information)\n\n\nACTION TAKEN TO-DATE (To include action taken by the School, Police, MA, Project Consultants etc):\n  School:\n  Police:\n  IFMC:\n\nFOLLOW-UP ACTION TO BE TAKEN:\n\n\nIMPLICATION OF INCIDENT:\n\n\nReported by     :                 (Name & Designation)\nVetted by       :                 (Name & Designation)\nContact Number  :", "fill": ["HEADING: one plain line, what happened and where. No adjectives.", "BACKGROUND: where the information came from, who reported, when, how. A source note, not a narrative of blame.", "ACTION TAKEN: fill School, Police and IFMC separately. \"Nil\" where genuinely nil, never blank.", "IMPLICATION: operational consequence only. Areas out of use, works stopped, follow-up needed. Not liability.", "Reported by: you. Vetted by: your FM.", "Never concede fault, liability or cause, in writing, on WhatsApp or verbally."], "points": ["Late incident report: +2 points.", "Harm to a person or damage to property: +5 points.", "No RA or MS before work: its own 5-point trigger.", "Fallen ceiling board or glass panel: also a 1% site-fee direct deduction."]}, "prompts": [{"t": "Triage an email from an OM or SCD", "p": "You are helping a facilities management executive on an MOE school IFM contract in Singapore. Read the email below and tell me: (1) what type it is: instruction, complaint, query, approval, quotation request or FYI; (2) which clock starts: 3 working days to reply for an instruction or complaint, 7 or 14 days for a quotation; (3) the reply-by date counting Singapore working days from today, [today's date]; (4) whether I should consult my FM before replying: injury or damage, negligence, money above my limit, contract interpretation, a named-person complaint, anything direct from the SO; (5) a short plain-English reply in Singapore professional tone, no exclamation marks, no emojis, acknowledging what they raised, stating what is known without speculating on cause, what will be done by when, and one question. Never concede fault or liability. Never mention pricing.\n\nEMAIL:\n[paste email, remove any pricing first]"}, {"t": "Draft a reply to a school", "p": "Draft a short email reply in Singapore professional tone: plain, courteous, factual, short paragraphs, no exclamation marks, no emojis, no over-apologising. Structure: acknowledge what they raised in their words; state what is factually known without speculating on cause; state what will be done, by whom, by when; ask the one question that unblocks the next step; close. Never concede fault, liability or cause. Never commit to a cost. Sign off as [my name].\n\nWhat they raised: [item]\nWhat is known: [facts]\nWhat we will do and by when: [action, date]\nThe one question: [question]"}, {"t": "Chase a vendor", "p": "Write a firm but courteous follow-up email to a subcontractor. This is follow-up number [1/2/3]. Outstanding item: [item], first requested on [date], chased on [dates]. I need it by [date]. If this is the second or third chase, say plainly that it will be recorded as outstanding at the structure meeting and copied to my FM, and invite them to call if there is a difficulty. Short, no exclamation marks, Singapore professional tone."}, {"t": "Minutes from my rough notes", "p": "Turn my rough notes into structure meeting minutes
